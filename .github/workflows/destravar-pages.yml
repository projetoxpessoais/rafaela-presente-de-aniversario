name: Atualizar publicacao do GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/destravar-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Reaplicar fonte main e gerar publicacao
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Reaplicando configuracao main / do GitHub Pages..."
          curl --fail-with-body -sSL --request PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${REPO}/pages" | jq '{status,build_type,source}'
          echo "Solicitando nova compilacao..."
          curl --fail-with-body -sSL --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pages/builds" | jq '{status,error,message}'
